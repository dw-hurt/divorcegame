<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divorce Quest - Diagnostic Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #00ff00;
        }
        .pass { background: #003300; color: #00ff00; }
        .fail { background: #330000; color: #ff0000; }
        h1 { color: #00ff00; }
    </style>
</head>
<body>
    <h1>🔍 Divorce Quest - Diagnostic Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function test(name, condition) {
            const div = document.createElement('div');
            div.className = 'test-result ' + (condition ? 'pass' : 'fail');
            div.textContent = (condition ? '✓ PASS: ' : '✗ FAIL: ') + name;
            results.appendChild(div);
            return condition;
        }

        // Run tests
        console.log('🔍 Running diagnostic tests...');
        
        test('HTML page loaded', true);
        test('JavaScript enabled', typeof console !== 'undefined');
        test('DOM ready', document.readyState === 'complete' || document.readyState === 'interactive');
        
        // Test CSS
        const cssLoaded = document.styleSheets.length > 0;
        test('CSS loaded', cssLoaded);
        
        // Check if files can be loaded
        const filesToCheck = [
            'css/style.css',
            'js/config.js',
            'js/utils.js',
            'js/api.js',
            'js/bayesian.js',
            'js/questionnaire.js',
            'js/scenarios.js',
            'js/outcomes.js',
            'js/content-manager.js',
            'js/idle-manager.js',
            'js/game-engine.js',
            'js/main.js'
        ];

        console.log('📁 Checking files...');
        
        filesToCheck.forEach(file => {
            fetch(file)
                .then(response => {
                    test(`File exists: ${file}`, response.ok);
                    if (!response.ok) {
                        console.error(`Missing: ${file} (${response.status})`);
                    }
                })
                .catch(error => {
                    test(`File exists: ${file}`, false);
                    console.error(`Error loading ${file}:`, error);
                });
        });

        // Add link to game
        setTimeout(() => {
            const link = document.createElement('div');
            link.style.marginTop = '20px';
            link.innerHTML = '<a href="index.html" style="color: #00ff00;">← Back to Game</a>';
            results.appendChild(link);
        }, 2000);
    </script>
</body>
</html>
